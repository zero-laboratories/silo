name: Publish

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Publish
        run: |
          echo "//silo-production-96d9.up.railway.app/:_authToken=$NODE_AUTH_TOKEN" >> ~/.npmrc
          npm publish --registry https://silo-production-96d9.up.railway.app --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git tag --sort=-v:refname | sed -n '2p' || true)
          BODY_PATH=$(mktemp)
          {
            echo "## ${GITHUB_REF_NAME}"
            echo ""
            {
              if [ -n "$PREV" ]; then
                git log --format='%s%n%b' "$PREV..$GITHUB_REF_NAME"
              else
                git log --format='%s%n%b'
              fi
            } | sed -e '/^\[silo\]/s/^\[silo\] *//' -e '/^$/d' -e 's/^/ - /'
          } > "$BODY_PATH"

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "$BODY_PATH"

      - name: Trim old versions (keep latest 10)
        run: |
          REGISTRY="https://silo-production-96d9.up.railway.app"
          PKG="@zeropbc/silo"
          TOKEN="${{ secrets.VERDACCIO_TOKEN }}"

          # Get all versions
          VERSIONS=$(curl -s "$REGISTRY/$PKG" -H "Authorization: Bearer $TOKEN" | node -e "
            const cmp = (a, b) => {
              const pa = a.split('.').map(Number);
              const pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if ((pa[i] ?? 0) !== (pb[i] ?? 0)) return (pa[i] ?? 0) - (pb[i] ?? 0);
              }
              return 0;
            };
            const d = JSON.parse(require('fs').readFileSync(0));
            const vs = Object.keys(d.versions).sort(cmp);
            const toRemove = vs.slice(0, -10);
            console.log(toRemove.join('\\n'));
          ")

          # Unpublish old versions
          while IFS= read -r ver; do
            [ -z "$ver" ] && continue
            echo "Unpublishing $ver"
            curl -s -X DELETE "$REGISTRY/$PKG/-/$ver" \
              -H "Authorization: Bearer $TOKEN"
          done <<< "$VERSIONS"
